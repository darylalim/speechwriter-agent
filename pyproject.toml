[project]
name = "speechwriter-agent"
version = "0.1.0"
description = "A speechwriter agent built with Deep Agents (LangChain / LangGraph)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daryl Lim" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "deepagents>=0.6.12,<0.8",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    # Tracing to a self-hosted Phoenix (src/speechwriter/tracing.py). Plain OpenTelemetry on
    # purpose, not `arize-phoenix-otel`: its `register()` raises AttributeError against
    # opentelemetry 1.45 (it reads the exporter's removed private `_headers`), walks up from
    # the CWD for a `.env.phoenix` to take credentials from, and pulls in grpcio for a gRPC
    # transport this never uses. HTTP exporter only, for the same reason.
    "openinference-instrumentation-langchain>=0.1.76",
    "openinference-semantic-conventions>=0.1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    # 1.62 for the widget parameters the web UI now depends on: persist_state and required on
    # the pickers, delta_description on st.metric, and download_button(on_click="ignore").
    # uv.lock resolves 1.62 and CI tests only that, so a lower floor was a claim nothing here
    # could check — a consumer installing at the floor met a TypeError on the Workspace page.
    "streamlit>=1.62.0",
]

[project.scripts]
speechwriter = "speechwriter.cli:main"

[project.optional-dependencies]
audio = [
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechwriter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# Ruff 0.16 formats Python code blocks inside Markdown too, which makes the formatter the
# only part of the toolchain that reaches into docs: `ruff check` skips Markdown entirely
# ("No Python files found"), and hooks/ruff-ty-gate.sh filters to *.py/*.pyi. Left on, a
# bare `uvx ruff format .` — the command CLAUDE.md documents — silently rewrites the
# hand-typeset code fences in README.md. Keep ruff's scope in this project = Python.
exclude = ["*.md"]

[tool.ty.environment]
# Point the type checker at the project virtualenv so third-party imports resolve.
python = "./.venv"

[tool.pytest.ini_options]
# arize-phoenix-client registers a pytest plugin through an entry point, so it loads into this
# suite whether asked for or not. It is inert here (no test carries its `phoenix` marker), but
# its tracking defaults to on and it parses PHOENIX_TEST_* on every collection, where a malformed
# value is a UsageError that fails the whole offline suite. Nothing here wants it.
addopts = ["-p", "no:phoenix"]

[dependency-groups]
dev = [
    # The eval harness's client for the self-hosted Phoenix: evals/sync_datasets.py mirrors the
    # datasets into it, and evals/run_experiment.py --phoenix records experiments there. Dev
    # rather than runtime because the packaged agent never talks to Phoenix's REST API — it
    # only exports spans, over plain OpenTelemetry (see the runtime comment above). This one
    # does pull in grpcio, which is why it stays out of the runtime dependencies.
    "arize-phoenix-client>=3.5.0",
    # evals/sync_datasets.py builds the Phoenix client's transport itself, so the client reads
    # no environment of its own. Imported directly, so declared — same reasoning as pyyaml below.
    "httpx>=0.28.1",
    # Same reasoning as pyyaml below: test_load_settings_reopens_the_langsmith_env_cache
    # imports langsmith.utils directly to assert on its `get_env_var` lru_cache, but langsmith
    # only arrives transitively via langchain-core.
    "langsmith>=0.11.1",
    "pytest>=9.1.1",
    # tests/test_build.py imports yaml to parse SKILL.md frontmatter. It arrives
    # transitively via langchain, so the suite passed without declaring it -- and
    # `uv sync --locked` in CI reproduces that same tree, so CI could not catch the
    # omission either. The day langchain drops pyyaml, the break would surface on the
    # next `uv lock` as a ModuleNotFoundError in an apparently unrelated test file.
    "pyyaml>=6.0",
    # Streamlit's fast file-watcher. Without it the dev server falls back to polling the
    # module tree on a timer and prints a startup hint on every launch; with it, an edit to
    # app_pages/ or src/ reruns the page immediately. Dev-group rather than a runtime dep
    # because it only matters while source changes underneath a running server -- the
    # packaged agent never needs it -- and `uv sync` installs dev groups by default, so the
    # documented install path picks it up anyway.
    "watchdog>=6.0.0",
]
