[server]
# Bind loopback only. Streamlit otherwise listens on every interface and prints an
# "External URL" on startup — which would put an unauthenticated agent that spends the
# project's API budget and reads the local workspace onto the network. Override
# deliberately (`--server.address 0.0.0.0`) if you actually intend to share it.
address = "localhost"

# "The Chamber": the green of a parliamentary bench, in daylight and with the house lights down.
#
# The palette comes from where speeches are given, not from a code editor. Both modes are one
# green at hue ~160: a reading copy on the bench by day, the room itself by night. Every role keeps
# its place across the switch, so the mode changes the light rather than the identity of the app.
#
# This app's main job is reading long prose aloud, so the type is a screen-reading serif at 16px,
# and the two body contrasts are deliberately not equal: about 11:1 in light and 8:1 in dark.
# Light text on a dark field halates, so carrying light mode's ratio across would tire the eye.
#
# Defining both [theme.light] and [theme.dark] makes Streamlit follow the viewer's system
# preference and adds a System/Light/Dark switch to the settings menu; a single-mode [theme]
# locks every viewer to one mode.
#
# Only what is genuinely mode-independent lives in [theme]: typography, radii, border flags.
# Theming stays in this file rather than in injected CSS, which is Streamlit's documented
# preference and keeps the page files free of styling concerns.
[theme]
# Underlined, not colour-only: link and body text are too close in dark mode for colour alone to
# mark a link, which is the WCAG F73 failure. Set explicitly so this block stays complete.
linkUnderline = true
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"
buttonRadius = "4px"
# Literata was drawn for long reading on screens. Streamlit has no separate UI font, so it carries
# the controls too, which is why the size is 16px rather than the 14px a sans would allow.
font = "Literata:https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap"
codeFont = "'Source Code Pro':https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500&display=swap"
codeFontSize = "0.8125rem"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["36px", "27px", "22px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

# Known limit: Streamlit renders captions as a 60% mix of text and background, and no key sets that
# colour. They measure 3.49:1 in light and 4.04:1 in dark, under AA, so keep anything a reader needs
# out of `st.caption`. Reaching 4.5:1 through textColor would cost the reading contrast above.

# Light mode — daylight on the bench. Body is about 11:1 on the page.
[theme.light]
backgroundColor = "#f4f7f5"
secondaryBackgroundColor = "#e5ece8"
codeBackgroundColor = "#ecf1ee"
textColor = "#2b3a33"
codeTextColor = "#2b3a33"
borderColor = "#b9c5bf"

# Dark enough to carry the white text Streamlit puts on a primary button.
primaryColor = "#1e6b52"
linkColor = "#17604a"
blueColor = "#1f5fa8"
greenColor = "#1b7446"
yellowColor = "#7f5f00"
orangeColor = "#9c4e0c"
redColor = "#b02e2b"
violetColor = "#6d3d9e"
grayColor = "#55635c"
chartCategoricalColors = ["#1e6b52", "#1f5fa8", "#6d3d9e", "#b02e2b", "#7f5f00", "#0f7c8a", "#9c4e0c"]

# Dark mode — house lights down. Body is about 8:1 on the page.
[theme.dark]
backgroundColor = "#1d2a26"
secondaryBackgroundColor = "#16211d"
codeBackgroundColor = "#121b18"
textColor = "#bac6be"
codeTextColor = "#bac6be"
borderColor = "#3a4c45"

# The tightest choice in the file. Streamlit uses primary as *text* on selected tabs and pills, and
# as a fill under a white icon on the chat send button. No colour reaches 4.5:1 for both on this
# field, so it clears 4.5:1 as text and 3:1 under the icon. The app has no `type="primary"` button,
# whose white label would need 4.5:1. Links use a paler step of the same green.
primaryColor = "#3fa37f"
linkColor = "#86d1b5"
blueColor = "#8abaea"
greenColor = "#84cf9c"
yellowColor = "#dfbe66"
orangeColor = "#e8a36a"
redColor = "#f09188"
violetColor = "#c5a8ec"
grayColor = "#98a69e"
chartCategoricalColors = ["#5fbf9c", "#8abaea", "#c5a8ec", "#f09188", "#dfbe66", "#6fc6d1", "#e8a36a"]

# The reading field is the lightest surface in both modes, and secondaryBackgroundColor steps
# away from it, so chat bubbles, containers and expanders read as panels and the prose stays the
# most prominent thing on screen. Sidebars take that same step in both modes.
[theme.light.sidebar]
backgroundColor = "#e5ece8"
secondaryBackgroundColor = "#f4f7f5"
codeBackgroundColor = "#ecf1ee"
borderColor = "#b9c5bf"

[theme.dark.sidebar]
backgroundColor = "#16211d"
secondaryBackgroundColor = "#1d2a26"
codeBackgroundColor = "#121b18"
borderColor = "#3a4c45"
