[server]
# Bind loopback only. Streamlit otherwise listens on every interface and prints an
# "External URL" on startup — which would put an unauthenticated agent that spends the
# project's API budget and reads the local workspace onto the network. Override
# deliberately (`--server.address 0.0.0.0`) if you actually intend to share it.
address = "localhost"

# One Light by day, One Dark Pro by night — Atom's sibling palettes, kept as a pair so the
# mode switch changes the light in the room rather than the identity of the app.
#
# This app's main job is reading long prose, so both modes are tuned for sustained reading
# rather than dashboard glanceability. The two body-text contrasts are deliberately *not*
# equal: 10.86:1 in light, 6.57:1 in dark. Dark mode wants the lower number — light text on a
# dark field halates, and carrying light mode's ratio across is exactly what makes most
# shipped dark themes (13-17:1) tiring over a four-minute speech. This pair replaced Solarized
# Light + a deepened Solarized Dark; the light half of that had 4.13:1 body text, under WCAG AA.
#
# Defining both [theme.light] and [theme.dark] makes Streamlit follow the viewer's system
# preference and adds a System/Light/Dark switch to the settings menu; a single-mode [theme]
# locks every viewer to one mode.
#
# Only what is genuinely mode-independent lives in [theme]: typography, radii, border flags.
# The two palettes give the same hue different values (blue is #4078f2 by day, #61afef by
# night), so accents and chart colors live in the per-mode tables even though Streamlit would
# accept them here — sharing one accent set across two palettes is what left the old config's
# primary at 3.80:1 on dark surfaces it was never picked against. Theming stays in this file
# rather than in injected CSS, which is Streamlit's documented preference and keeps the page
# files free of styling concerns.
[theme]
linkUnderline = false
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"
buttonRadius = "4px"
font = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
codeFont = "'Source Code Pro':https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500&display=swap"
codeFontSize = "0.875rem"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

# Light mode — One Light (atom/one-light-syntax). Body #383a42 on #fafafa is 10.86:1.
[theme.light]
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#eaeaeb"
codeBackgroundColor = "#f0f0f1"
textColor = "#383a42"
codeTextColor = "#383a42"
borderColor = "#c6c6c8"

primaryColor = "#4078f2"
linkColor = "#4078f2"
blueColor = "#4078f2"
greenColor = "#50a14f"
yellowColor = "#c18401"
orangeColor = "#986801"
redColor = "#e45649"
violetColor = "#a626a4"
chartCategoricalColors = ["#4078f2", "#50a14f", "#a626a4", "#e45649", "#c18401", "#0184bc", "#986801"]

# Dark mode — One Dark Pro (the Atom/VS Code palette). Body #abb2bf on #282c34 is 6.57:1.
# Same hue order as light, different values: each accent is the one One Dark picked against
# its own field, which is why every one clears 4.38:1 here rather than scraping 3:1.
[theme.dark]
backgroundColor = "#282c34"
secondaryBackgroundColor = "#21252b"
codeBackgroundColor = "#1e2127"
textColor = "#abb2bf"
codeTextColor = "#abb2bf"
borderColor = "#3e4451"

primaryColor = "#61afef"
linkColor = "#61afef"
blueColor = "#61afef"
greenColor = "#98c379"
yellowColor = "#e5c07b"
orangeColor = "#d19a66"
redColor = "#e06c75"
violetColor = "#c678dd"
chartCategoricalColors = ["#61afef", "#98c379", "#c678dd", "#e06c75", "#e5c07b", "#56b6c2", "#d19a66"]

# The reading field is the lightest surface in both modes, and secondaryBackgroundColor steps
# away from it — so the chat bubbles, containers and expanders this app leans on read as
# panels and the prose stays the most prominent thing on screen. Sidebars take that same step,
# sitting one layer off the main content in both modes.
[theme.light.sidebar]
backgroundColor = "#eaeaeb"
secondaryBackgroundColor = "#fafafa"
codeBackgroundColor = "#f0f0f1"
borderColor = "#c6c6c8"

[theme.dark.sidebar]
backgroundColor = "#21252b"
secondaryBackgroundColor = "#282c34"
codeBackgroundColor = "#1e2127"
borderColor = "#3e4451"
