name: Release

# Tags and publishes a GitHub Release when `[project] version` in pyproject.toml changes.
# It runs unattended, which is only safe because of the two guards below: the tag-exists
# check (this trigger also fires on dependency bumps, which touch pyproject.toml but leave
# the version alone) and the gate re-run (nothing is tagged unless the tree is green).

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:

# The one workflow here that writes. `gh release create` needs it to create both the tag
# and the release; ci.yml stays contents: read.
permissions:
  contents: write

# Serialize. Two bumps landing close together must not race to create the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RUFF_VERSION: "0.16.0"
  TY_VERSION: "0.0.63"

jobs:
  check:
    name: version bumped?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      # Full history so every existing tag is visible to the check below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No uv setup in this job: the common case is a dependency bump that is not a
      # release, and it should cost seconds. tomllib is stdlib on the runner's python3.
      - id: v
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: tag and publish
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-suffix: py3.11

      # ci.yml runs the full matrix on this same commit, but nothing orders the two
      # workflows, so this re-checks on the declared floor interpreter rather than tagging
      # a commit whose verdict has not landed. test_package_version_matches_pyproject is
      # the one that specifically makes an unattended release safe: it fails if
      # __version__ was not bumped alongside pyproject.toml, before anything is tagged.
      - name: Verify before tagging
        run: |
          uv sync --locked
          uvx ruff@"$RUFF_VERSION" check .
          uv run pytest -q
          uvx ty@"$TY_VERSION" check

      # `gh release create` creates the tag at this commit as well as the release, so there
      # is no separate git tag/push step and no bot git identity to configure. Notes are
      # generated server-side from the commits since the previous release.
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
