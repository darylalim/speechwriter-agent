name: CI

# The three gates CLAUDE.md requires to stay clean: ruff check, pytest, ty check.
# Why this exists alongside .claude/hooks/ is documented in CLAUDE.md § Automation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned, unlike the bare `uvx ruff` / `uvx ty` in .claude/hooks — unpinned, uvx
  # resolves the newest release at run time, so an Astral release could redden a PR that
  # changed nothing. ty is pre-1.0 and moves fastest; bump both together, on purpose.
  RUFF_VERSION: "0.16.0"
  TY_VERSION: "0.0.63"

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Exact tag, not `@v9`: setup-uv stopped publishing floating major tags after v7,
      # so `@v9` resolves to nothing. Confirm a tag exists before bumping.
      - uses: astral-sh/setup-uv@v9.0.0

      # Outside the matrix and with no `uv sync`: ruff needs no project deps, and
      # target-version = "py311" fixes its syntax target, so the verdict is identical on
      # every interpreter. `ruff format --check` is omitted deliberately — Ruff 0.16 also
      # formats Python inside Markdown and would churn README.md's aligned fences.
      - run: uvx ruff@"$RUFF_VERSION" check --output-format=github .

  test:
    name: pytest + ty (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - run: uv sync --locked

      # Never add ANTHROPIC_API_KEY or TAVILY_API_KEY here. Their absence is what checks
      # CLAUDE.md's "building the agent must not call the model or the network"
      # invariant, and it pins the no-Tavily `[VERIFY]` prompt branch.
      - run: uv run pytest -q

      # After sync and inside the matrix: [tool.ty.environment] points ty at ./.venv, so
      # it resolves imports and infers its target version from the synced interpreter.
      - run: uvx ty@"$TY_VERSION" check
