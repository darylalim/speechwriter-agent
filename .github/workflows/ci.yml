name: CI

# The three gates CLAUDE.md requires to stay clean: ruff check, pytest, ty check.
# Why this exists alongside .claude/hooks/ is documented in CLAUDE.md § Automation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned because unpinned, uvx resolves the newest release at run time, so an Astral
  # release could redden a PR that changed nothing. ty is pre-1.0 and moves fastest. These
  # pins are repeated at the other sites CLAUDE.md names, and a test keeps them in step.
  RUFF_VERSION: "0.17.4"
  TY_VERSION: "0.0.99"

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Exact tag, not `@v9`: setup-uv stopped publishing floating major tags after v7,
      # so `@v9` resolves to nothing. Confirm a tag exists before bumping.
      - uses: astral-sh/setup-uv@v9.0.0

      # Outside the matrix and with no `uv sync`: ruff needs no project deps, and
      # target-version = "py311" fixes its syntax target, so the verdict is identical on
      # every interpreter.
      - run: uvx ruff@"$RUFF_VERSION" check --output-format=github .
      - run: uvx ruff@"$RUFF_VERSION" format --check .

  test:
    name: pytest + ty (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - run: uv sync --locked

      # Never add ANTHROPIC_API_KEY, TAVILY_API_KEY, DEEPGRAM_API_KEY or any LANGSMITH_*
      # variable here. Their absence is what checks CLAUDE.md's "building the agent must not
      # call the model or the network" invariant, pins the no-Tavily `[VERIFY]` prompt branch,
      # keeps the opt-in Deepgram test skipped, and keeps every run untraced.
      - run: uv run pytest -q

      # After sync and inside the matrix: [tool.ty.environment] points ty at ./.venv, so
      # it resolves imports and infers its target version from the synced interpreter.
      - run: uvx ty@"$TY_VERSION" check

  # The one check a ruleset on `main` should require. Requiring the matrix legs by name ties
  # the ruleset to `python-version`: drop or add a version and every PR waits forever on a
  # check that never runs, with no error to say why. This name never changes.
  #
  # `if: always()` is load-bearing. Without it, a failed gate makes this job *skipped*, and
  # GitHub counts a skipped required check as passing, so the rule would wave through exactly
  # the runs it exists to stop. `needs` must name every other job here, and
  # test_ci_ok_requires_every_gate keeps it that way.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every gate to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
